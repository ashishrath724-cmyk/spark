<div id="ob" hidden></div>

<script>
'use strict';
/* ===== Text (i18n-ready: swap this object to translate) ===== */
const T={tag:'Move more. Live stronger.',gM:'Good morning',gA:'Good afternoon',gE:'Good evening',wb:'Welcome back',
 auto:'Automatic tracking',man:'Manual tracking',noAuto:"Automatic step tracking isn't available on this browser.",
 denied:'Motion access was denied. Allow it in your browser or site settings, or enter steps manually.',
 health:'Health data integration requires a supported mobile/native environment.',local:'Your data is stored on this device. Sharing is always your choice.',
 disc:'Motivational score based on your activity. Not a medical measurement.',est:'Estimated from your steps and stride. Not a medical measurement.',
 noAct:['No activity yet','Your first movement of the day starts here.'],noW:['Stay hydrated','Log your first drink.'],
 noI:['Build your history','Your trends will appear as you use SPARK.']};
const NAV=[['home','Home','<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>'],['act','Activity','<path d="M3 12h4l3-8 4 16 3-8h4"/>'],['wat','Water','<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.500 6-11 6-11z"/>'],['ins','Insights','<path d="M5 20V10M12 20V4M19 20v-7"/>'],['lb','Ranks','<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>'],['pro','Profile','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>']];
const TYPES=[['walking','Walking'],['running','Running'],['cycling','Cycling'],['gym','Gym'],['sports','Sports'],['swimming','Swimming'],['yoga','Yoga'],['other','Other']];
/* ===== Helpers ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dk=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dk(d)};
const nf=n=>Math.round(n).toLocaleString(),nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const fT=t=>{try{return new Date('1970-01-01T'+t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){return t}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ===== State & storage (single module; swap for IndexedDB later) ===== */
const KEY='spark.v1';
const def=()=>({version:1,onboarded:false,profile:{name:'',age:'',height:'',weight:'',stride:''},settings:{stepGoal:10000,waterGoal:2500,units:'metric',wu:'L',theme:'system',ts:'m',notify:false,auto:false,installDismissed:false,lb:false,nick:'',uid:'',sec:'',cityName:''},dailyRecords:{},activities:[],waterEntries:[],goals:[]});
const merge=(a,b)=>({...a,...b,profile:{...a.profile,...(b.profile||{})},settings:{...a.settings,...(b.settings||{})}});
let S=def(),storeOK=true,V='home',monthOff=0,selDay=null,tmr;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=merge(def(),JSON.parse(r))}catch(e){storeOK=false}}
function save(){syncSoon();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(storeOK){storeOK=false;toast("Storage is unavailable, so changes won't be kept after you close SPARK.")}}}
const saveSoon=()=>{clearTimeout(tmr);tmr=setTimeout(save,1200)};
/* ===== Derived data ===== */
const imp=()=>S.settings.units==='imperial',R=d=>S.dailyRecords[d]||{steps:0,auto:0};
const steps=d=>R(d).steps,goalFor=d=>R(d).g||S.settings.stepGoal;
const wEnt=d=>S.waterEntries.filter(w=>w.date===d).sort((a,b)=>a.time<b.time?-1:1),water=d=>wEnt(d).reduce((s,w)=>s+w.ml,0);
const acts=d=>S.activities.filter(a=>a.date===d).sort((a,b)=>a.time<b.time?-1:1),mins=d=>acts(d).reduce((s,a)=>s+(+a.min||0),0);
const strideM=()=>{const p=S.profile;return +p.stride>0?p.stride/100:+p.height>0?p.height*.415/100:.75};
const distM=d=>steps(d)*strideM(),kcal=d=>steps(d)*.04*(+S.profile.weight>0?S.profile.weight/70:1);
const active=d=>steps(d)>=1000||acts(d).length>0;
const fD=m=>imp()?(m/1609.34).toFixed(1)+' mi':(m/1000).toFixed(1)+' km',fKm=k=>fD(k*1000);
const fW=ml=>S.settings.wu==='oz'?Math.round(ml/29.5735)+' oz':S.settings.wu==='ml'?Math.round(ml)+' ml':(ml/1000).toFixed(2)+' L';
const toMl=v=>S.settings.wu==='oz'?v*29.5735:S.settings.wu==='ml'?v:v*1000,fromMl=ml=>S.settings.wu==='oz'?Math.round(ml/29.5735):S.settings.wu==='ml'?Math.round(ml):+(ml/1000).toFixed(2);
const wUnit=()=>S.settings.wu,quick=()=>wUnit()==='oz'?[8,12,16,24].map(n=>[Math.round(n*29.5735),n+' oz']):[250,350,500,750].map(n=>[n,'+'+n+' ml']);
function streaks(){const t=dk();let cur=0,d=active(t)?t:ad(t,-1);while(active(d)&&cur<5000){cur++;d=ad(d,-1)}
 const ks=[...Object.keys(S.dailyRecords),...S.activities.map(a=>a.date)].sort();let best=0,run=0;if(ks.length){let x=ks[0];while(x<=t){if(active(x)){run++;best=Math.max(best,run)}else run=0;x=ad(x,1)}}
 const all=Object.keys(S.dailyRecords);return{cur,best:Math.max(best,cur),days:new Set([...all.filter(active),...S.activities.map(a=>a.date)]).size,sg:all.filter(d=>steps(d)>0&&steps(d)>=goalFor(d)).length,wg:[...new Set(S.waterEntries.map(w=>w.date))].filter(d=>water(d)>=S.settings.waterGoal).length}}
function momentum(d){const wk=[...Array(7)].map((_,i)=>ad(d,-i)).filter(active).length;return Math.round(100*(.5*Math.min(1,steps(d)/goalFor(d))+.3*Math.min(1,water(d)/S.settings.waterGoal)+.2*Math.min(1,wk/5)))}
const mMsg=m=>m<25?'Every step counts. Start small.':m<50?'Momentum is building.':m<75?'Good momentum today.':'Strong momentum today.';
function goalInfo(g){const t=dk();let c,l,f=n=>nf(n);
 if(g.type==='steps'){c=steps(t);l=nf(g.target)+' steps/day'}else if(g.type==='water'){c=water(t);l=fW(g.target)+' water/day';f=fW}else if(g.type==='minutes'){c=mins(t);l=g.target+' active min/day'}else{c=[...Array(7)].map((_,i)=>ad(t,-i)).filter(active).length;l=g.target+' active days/week'}
 return{l,p:Math.min(1,c/g.target),txt:f(c)+' / '+f(g.target)}}
/* ===== UI utilities ===== */
let tt;function toast(m,undo){if(/^Step goal reached/.test(m))burst();const e=$('#toast');e.innerHTML=esc(m)+(undo?'<button type="button" id="undo">Undo</button>':'');e.classList.add('on');if(undo)$('#undo').onclick=()=>{undo();e.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),undo?5000:3200)}
function ask(title,fields,ok,label='Save',msg=''){const d=document.createElement('dialog');d.setAttribute('aria-label',title);
 d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>${msg?`<p class="mu" style="margin-bottom:14px">${esc(msg)}</p>`:''}${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.n}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==f.v?' selected':''}>${o[1]}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.a||''}>`}</label>`).join('')}<div class="row"><button type="button" class="btn2" onclick="this.closest('dialog').close('x')">Cancel</button><button value="ok" class="btn">${label}</button></div></form>`;
 document.body.append(d);d.addEventListener('close',()=>{if(d.returnValue==='ok')ok(Object.fromEntries(new FormData(d.querySelector('form'))));d.remove()});try{d.showModal()}catch(e){d.setAttribute('open','')}}
const num=(v,min,max)=>{const n=parseFloat(v);return n>=min&&n<=max?n:null};
const bar=(p,c='')=>`<div class="pb ${c}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}"><i style="width:0" data-a="width:${p*100}%"></i></div>`;
const empty=(a,btn='')=>`<div class="empty"><b>${a[0]}</b><p class="mu">${a[1]}</p>${btn}</div>`;

const LB={cat:'steps',per:'today',rows:null,err:'',busy:false},rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
const wkStart=()=>{const d=pd(dk());return dk(new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7))};
const range=p=>{const t=dk();return p==='today'?[t,t]:p==='week'?[wkStart(),t]:[t.slice(0,8)+'01',t]};
let sy;const syncSoon=()=>{if(S.settings.lb){clearTimeout(sy);sy=setTimeout(sync,15000)}};
async function sync(){const s=S.settings;if(!s.lb||!s.nick)return false;const days={};
 for(let i=0;i<35;i++){const d=ad(dk(),-i),a=steps(d),w=water(d);if(a||w)days[d]=[Math.min(Math.round(a),100000),Math.min(Math.round(w),10000)]}
 try{return(await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.uid,sec:s.sec,nick:s.nick,city:s.cityName||'',days})})).ok}catch(e){return false}}
const lbDraw=()=>{if(V==='lb')render(true)};
async function lbLoad(){const s=S.settings;if(!s.lb)return;LB.busy=true;LB.err='';lbDraw();const[f,t]=range(LB.per),key=LB.cat+LB.per;
 try{await sync();const r=await fetch(`${API}?from=${f}&to=${t}&cat=${LB.cat}&id=${s.uid}`);if(!r.ok)throw 0;const j=await r.json();if(key!==LB.cat+LB.per)return;LB.rows=j}catch(e){if(key!==LB.cat+LB.per)return;LB.rows=null;LB.err="Couldn't reach the leaderboard. Check your connection and try again."}LB.busy=false;lbDraw()}
const geo=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):no(new Error('none')));
async function place(){const c=(await geo()).coords;let city='',name='';try{const j=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${c.latitude}&longitude=${c.longitude}&localityLanguage=en`)).json();city=j.city||j.locality||'';name=[j.locality||j.city,j.principalSubdivision].filter(Boolean).join(', ')}catch(e){}return{city,name,la:c.latitude,lo:c.longitude}}
Object.assign(A,{lbSet:d=>{LB[d.k]=d.v;LB.rows=null;lbLoad()},
 lbJoin:()=>ask('Join the leaderboard',[{n:'n',l:'Nickname (shown publicly)',v:S.profile.name,a:'maxlength=20 minlength=2 required'},{n:'c',l:'Show my city next to my name',o:[['0','No'],['1','Yes, use my current location']],v:'0'}],async v=>{const n=v.n.trim().slice(0,20);if(n.length<2)return toast('Choose a nickname with 2 to 20 characters.');const s=S.settings;let cn='';
   if(v.c==='1'){try{cn=(await place()).city}catch(e){toast("Couldn't get your city, so you joined without it.")}}
   s.nick=n;s.cityName=cn;if(!s.uid){s.uid=rnd(16);s.sec=rnd(24)}s.lb=true;save();LB.rows=null;lbLoad()},'Join','Only your nickname, optional city and daily step and water totals are sent. Your precise location is never added to the leaderboard.'),
 lbLeave:()=>ask('Leave the leaderboard?',[],async()=>{const s=S.settings;let ok=false;try{ok=(await fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.uid,sec:s.sec})})).ok}catch(e){}
   if(!ok)return toast("Couldn't reach the server, so your entry wasn't deleted. Try again when online.");s.lb=false;save();LB.rows=null;render(true);toast('You left the leaderboard.')},'Leave','This deletes your entry from the leaderboard. Your data on this device stays.'),
 batt:()=>SC&&SC.openBatterySettings().catch(()=>{})});
function lbHTML(){const s=S.settings,seg=(k,o)=>`<div class="row" role="group" style="margin-bottom:10px">${o.map(x=>`<button class="chip" data-act="lbSet" data-k="${k}" data-v="${x[0]}" aria-pressed="${LB[k]===x[0]}">${x[1]}</button>`).join('')}</div>`,hd=`<header class="hd"><h1>Leaderboard</h1><p class="mu">Everyone using SPARK</p></header>`;
 if(!s.lb)return hd+`<section class="card"><h3>Join the leaderboard</h3><p class="mu" style="margin:6px 0 12px">See who walked and hydrated the most today, this week and this month. Joining is optional. If you join, your nickname and daily step and water totals are sent to the server.</p><button class="btn" style="width:100%" data-act="lbJoin">Join with a nickname</button></section>`;
 const R=LB.rows,f=v=>LB.cat==='steps'?nf(v)+' steps':fW(v),row=(r,i)=>`<li class="li"><span class="tm" style="min-width:40px">${i<3&&r.rank<4?['🥇','🥈','🥉'][i]:'#'+r.rank}</span><div><b>${esc(r.n)}${r.me?' (you)':''}</b>${r.c?`<small>${esc(r.c)}</small>`:''}</div><b style="flex:none">${f(r.v)}</b></li>`;
 const b=LB.err?`<section class="card warn"><p>${esc(LB.err)}</p><button class="btn2" style="margin-top:10px" data-act="lbSet" data-k="per" data-v="${LB.per}">Try again</button></section>`:!R?`<section class="card"><p class="mu" aria-live="polite">Loading…</p></section>`:`<section class="card" aria-live="polite">${R.top.length?`<ul>${R.top.map(row).join('')}</ul>`:empty(['No entries yet','Be the first on the board.'])}${R.me&&!R.top.some(r=>r.me)?`<ul style="border-top:2px solid var(--ln);margin-top:6px">${row(R.me,9)}</ul>`:''}</section>`;
 return hd+seg('cat',[['steps','Highest steps'],['water','Highest water']])+seg('per',[['today','Today'],['week','This week'],['month','This month']])+b+`<p class="note">Totals are reported by each person's app. Weeks start on Monday and use each person's own date.</p><button class="btn2" style="width:100%;margin-top:12px" data-act="lbLeave">Leave leaderboard</button>`}
function extraHTML(){return `${NATIVE?`<section class="card"><h3>Background counting</h3><p class="mu" style="margin:6px 0 12px">SPARK counts steps with your phone's built-in step counter, even when the app is closed. On some phones you must also allow background activity.</p><button class="btn2" data-act="batt">Battery settings</button></section>`:`<section class="card"><h3>Get the Android app</h3><p class="mu" style="margin:6px 0 12px">Counts your steps in the background, even when SPARK is closed.</p><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="spark.apk" download>Download APK</a><p class="note">After downloading, open the file and allow installs from this source if Android asks.</p></section>`}<section class="card" aria-label="About the developer"><h3>About the dev</h3><img src="${DEV}" alt="Subhasis Tripathy" style="width:100%;aspect-ratio:1/1.02;object-fit:cover;object-position:50% 100%;border-radius:16px;margin:6px 0 14px"><h2 style="font-family:Georgia,serif;font-size:1.4rem">Built for the comeback.</h2><p style="margin-bottom:10px">I built this app because getting healthier shouldn’t feel complicated.</p><p style="margin-bottom:10px">Every step counts. Every glass of water counts. Every small decision adds up.</p><p style="margin-bottom:10px">This app is designed to help you stay consistent, track your progress, and build habits that actually last. Whether you’re just starting your journey or pushing toward your next level.</p><p style="margin-bottom:10px"><b>No perfection. No excuses. Just progress.</b></p><p>Built with passion by <b>Me</b> - for everyone choosing to become a better version of themselves, one day at a time. 🖤</p></section>`}
setInterval(()=>{S.settings.lb&&sync()},3e5);

/* ===== Boot ===== */
load();apply();mq.addEventListener&&mq.addEventListener('change',apply);pwa();setInterval(tick,6e4);
if(S.onboarded){const q=new URLSearchParams(location.search).get('view');V={water:'wat',activity:'act',insights:'ins'}[q]||'home';render();if(NATIVE)Native.start();else if(S.settings.auto&&Sensor.supported()&&!Sensor.needsPerm())Sensor.start();if(q==='glance')glance()}else showOb(0);
</script>
